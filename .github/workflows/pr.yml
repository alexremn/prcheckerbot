name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # "24" is the `engines` floor; "26" is the runtime the published image ships.
        node-version: ["24", "26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate default config JSON
        run: node -e "JSON.parse(require('fs').readFileSync('config/default.json','utf8'))"

      # test:coverage, not test — `npm test` skips coverage, so the thresholds
      # in jest.config.js would never actually gate anything in CI.
      - name: Run tests with coverage
        run: npm run test:coverage

  # The branch ruleset requires a status check named exactly "Lint and test".
  # Matrix legs report as "Lint and test (Node 24|26)", so this job keeps that
  # required context stable — do not rename it without updating the ruleset.
  gate:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Verify matrix result
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Node matrix result: $RESULT"
          [ "$RESULT" = "success" ] || exit 1
